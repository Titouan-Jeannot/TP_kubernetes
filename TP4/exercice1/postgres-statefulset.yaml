
# Service Headless associé au StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
# Déploiement PostgreSQL avec une identité stable
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres-headless
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:13

          env:
            - name: POSTGRES_USER
              value: "admin"
            - name: POSTGRES_PASSWORD
              value: "password"
            - name: POSTGRES_DB
              value: "reviews"
            # Stocker les fichiers dans un sous-dossier du volume
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"

          ports:
            - containerPort: 5432

          # Monter le stockage persistant
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

  # Créer automatiquement un PVC pour chaque Pod
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: rook-ceph-block
        resources:
          requests:
            storage: 1Gi

