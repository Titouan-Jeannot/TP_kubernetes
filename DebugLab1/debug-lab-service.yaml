apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-alpha
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mon-api
  template:
    metadata:
      labels:
        app: mon-api
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo
          args:
            - "-listen=:5678"
            - "-text=Reponse du deploiement Alpha"
          ports:
            - containerPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-beta
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mon-api
  template:
    metadata:
      labels:
        app: mon-api
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo
          args:
            - "-listen=:5678"
            - "-text=Reponse du deploiement Beta"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: mon-api
  ports:
    - port: 80
      targetPort: 5678
