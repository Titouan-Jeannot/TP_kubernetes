
apiVersion: apps/v1
kind: Deployment

metadata:
  name: python-api-deployment

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: python-api
      
  template:
    metadata:
      labels:
        app: python-api

    spec:
      containers:
        - name: python-api

          # Nouvelle image avec l'endpoint /health
          image: titouan2235/tp1pythonkub:v2

          ports:
            - containerPort: 8000

          # Vérifie si le Pod peut recevoir du trafic
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

          # Vérifie si le conteneur fonctionne encore
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
